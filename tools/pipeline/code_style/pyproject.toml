[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "raiders-code-style"
version = "0.1.0"
description = "Windows formatting and block-separation checks for Raiders Engine"
requires-python = ">=3.12,<3.13"
dependencies = [
    "clang-format==19.1.5",
    "ruff==0.9.10",
    "gersemi==0.22.1",
    "tree-sitter-language-pack==0.13.0",
    "tree-sitter==0.25.2",
    "tree-sitter-c-sharp==0.23.5",
    "tree-sitter-embedded-template==0.25.0",
    "tree-sitter-yaml==0.7.2",
    "appdirs==1.4.4",
    "lark==1.3.1",
    "PyYAML==6.0.3",
]

[project.scripts]
raiders-style = "raiders_code_style.__main__:main"

[project.optional-dependencies]
test = ["pytest==8.3.5", "colorama==0.4.6", "iniconfig==2.1.0", "packaging==24.2", "pluggy==1.5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.setuptools.packages.find]
where = ["src"]
