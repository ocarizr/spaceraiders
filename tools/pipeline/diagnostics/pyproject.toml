[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "raiders-diagnostics"
version = "0.1.0"
description = "Structured logs and bounded elapsed-time profiling for Raiders Engine pipelines"
requires-python = ">=3.12,<3.13"

[project.scripts]
raiders-telemetry = "raiders_diagnostics.profiling:main"

[project.optional-dependencies]
test = ["pytest==9.1.1", "colorama==0.4.6", "iniconfig==2.1.0", "packaging==24.2", "pluggy==1.5.0", "pygments==2.21.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
strict_config = true
strict_markers = true

[tool.setuptools.packages.find]
where = ["src"]
